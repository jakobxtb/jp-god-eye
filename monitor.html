<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JP GOD EYE — Monitor</title>
  <link rel="icon" href="/logo.svg" />
  <style>
    :root {
      --bg:#05070a; --panel:rgba(255,255,255,.03); --line:rgba(255,255,255,.09);
      --accent:#78c8ff; --up:#3ad07a; --down:#ff5a5a; --amber:#ffb020;
      --crit:#ff3b3b; --high:#ff8a1f; --mod:#ffd21f; --low:#4aa8ff;
      --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:rgba(255,255,255,.86); font-family:var(--mono); font-size:13px; }
    a { color:inherit; text-decoration:none; }
    .topbar { display:flex; align-items:center; gap:18px; padding:10px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(5,7,10,.94); backdrop-filter:blur(8px); z-index:20; }
    .brand { display:flex; align-items:center; gap:8px; font-size:15px; letter-spacing:.22em; }
    .brand b { color:var(--accent); font-weight:700; }
    .brand img { width:20px; height:20px; }
    .appnav { display:flex; gap:2px; }
    .appnav a { padding:4px 12px; font-size:10px; letter-spacing:.16em; color:rgba(255,255,255,.5); border:1px solid var(--line); }
    .appnav a:hover { color:#fff; border-color:rgba(120,200,255,.4); }
    .appnav a.on { color:var(--accent); border-color:rgba(120,200,255,.5); background:rgba(120,200,255,.1); }
    .clock { margin-left:auto; color:rgba(255,255,255,.5); font-size:11px; letter-spacing:.1em; }
    .tabs { display:flex; gap:2px; padding:8px 18px 0; border-bottom:1px solid var(--line); overflow-x:auto; }
    .tab { padding:8px 16px; font-size:11px; letter-spacing:.14em; color:rgba(255,255,255,.5); border:1px solid var(--line); border-bottom:none; cursor:pointer; white-space:nowrap; background:none; font-family:inherit; }
    .tab.on { color:var(--accent); border-color:rgba(120,200,255,.5); background:rgba(120,200,255,.08); }
    .tabsub { font-size:9px; color:rgba(255,255,255,.35); display:block; letter-spacing:.06em; }
    main { padding:16px 18px 60px; }
    .view { display:none; }
    .view.on { display:block; }
    .grid { display:grid; gap:12px; }
    .cols-2 { grid-template-columns:1.6fr 1fr; }
    .cols-4 { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .cols-cams { grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
    @media (max-width:820px){ .cols-2{grid-template-columns:1fr;} }
    .card { background:var(--panel); border:1px solid var(--line); padding:12px 14px; }
    .card h3 { margin:0 0 10px; font-size:10px; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; }
    .muted { color:rgba(255,255,255,.4); }
    .up { color:var(--up); } .down { color:var(--down); } .flat { color:rgba(255,255,255,.55); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .row:last-child { border-bottom:none; }
    .sym { display:flex; align-items:center; gap:8px; min-width:0; }
    .sym img { width:18px; height:18px; border-radius:50%; }
    .sym .name { color:rgba(255,255,255,.55); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .price { text-align:right; }
    .price .chg { font-size:11px; }
    .wire-item { display:block; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .wire-item .t { color:rgba(255,255,255,.9); line-height:1.35; }
    .wire-item .m { font-size:10px; color:rgba(255,255,255,.4); margin-top:3px; display:flex; gap:8px; }
    .wire-item:hover .t { color:var(--accent); }
    .ev { padding:10px 12px; border-left:3px solid var(--low); background:rgba(255,255,255,.02); margin-bottom:8px; }
    .ev.critical { border-color:var(--crit); } .ev.high { border-color:var(--high); }
    .ev.moderate { border-color:var(--mod); } .ev.low { border-color:var(--low); }
    .ev .badge { font-size:9px; letter-spacing:.1em; padding:1px 6px; border:1px solid currentColor; border-radius:2px; }
    .ev.critical .badge { color:var(--crit); } .ev.high .badge { color:var(--high); }
    .ev.moderate .badge { color:var(--mod); } .ev.low .badge { color:var(--low); }
    .ev .head { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
    .ev .t { color:rgba(255,255,255,.9); }
    .ev .m { font-size:10px; color:rgba(255,255,255,.42); margin-top:4px; }
    .stat { text-align:center; padding:14px 8px; }
    .stat .n { font-size:26px; color:var(--accent); font-weight:700; }
    .stat .l { font-size:9px; letter-spacing:.12em; color:rgba(255,255,255,.45); margin-top:4px; text-transform:uppercase; }
    .pred { padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .pred .q { color:rgba(255,255,255,.85); font-size:12px; line-height:1.3; }
    .bar { height:5px; background:rgba(255,255,255,.08); margin-top:6px; position:relative; }
    .bar > i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); }
    .cam { background:#000; border:1px solid var(--line); position:relative; aspect-ratio:16/10; overflow:hidden; }
    .cam img { width:100%; height:100%; object-fit:cover; display:block; }
    .cam .lab { position:absolute; left:0; right:0; bottom:0; padding:5px 8px; font-size:10px; background:linear-gradient(transparent,rgba(0,0,0,.8)); color:#fff; }
    .cam .cc { position:absolute; top:6px; left:6px; font-size:9px; padding:1px 5px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); }
    .loading { color:rgba(255,255,255,.4); padding:20px 0; text-align:center; }
    .err { color:var(--down); padding:12px 0; font-size:12px; }
    .src { font-size:9px; color:rgba(255,255,255,.35); letter-spacing:.08em; }
    .controls { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
    .controls select, .controls button { background:var(--panel); border:1px solid var(--line); color:#fff; font-family:inherit; font-size:11px; padding:6px 10px; cursor:pointer; }
    .foot { padding:20px 18px; border-top:1px solid var(--line); font-size:10px; color:rgba(255,255,255,.35); }
    .foot a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="/logo.svg" alt="" /> <b>JP GOD</b> EYE</div>
    <nav class="appnav">
      <a href="/">GLOBE</a>
      <a href="/osiris">OSIRIS</a>
      <a href="/monitor.html" class="on">MONITOR</a>
    </nav>
    <span class="clock" id="clock"></span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-view="wire">WIRE<span class="tabsub">world-monitor</span></button>
    <button class="tab" data-view="situation">SITUATION<span class="tabsub">the-situation</span></button>
    <button class="tab" data-view="theater">THEATER<span class="tabsub">war.direct</span></button>
    <button class="tab" data-view="markets">MARKETS<span class="tabsub">crypto · metals · indices</span></button>
    <button class="tab" data-view="cameras">CAMERAS<span class="tabsub">all feeds</span></button>
  </div>

  <main>
    <section class="view on" id="view-wire"></section>
    <section class="view" id="view-situation"></section>
    <section class="view" id="view-theater"></section>
    <section class="view" id="view-markets"></section>
    <section class="view" id="view-cameras"></section>
  </main>

  <div class="foot">
    JP GOD EYE — Monitor · Built on free public feeds: GDELT · Google News · USGS · EMSC · GDACS · NASA FIRMS · adsb.lol · AISStream · CoinGecko · gold-api · Yahoo Finance · Frankfurter (ECB) · Polymarket.
    <a href="/">← Back to the globe</a>
  </div>

  <script type="module" src="/src/monitor/monitor.js"></script>
</body>
</html>
